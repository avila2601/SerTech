<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-ingreso" (click)="$event.stopPropagation()">
  <form (ngSubmit)="onLogin()" #loginForm="ngForm" autocomplete="off">
    <div class="form-group">
      <label for="technicianId">ID de Técnico</label>
      <input
        #technicianIdInput
        id="technicianId"
        [(ngModel)]="technicianId"
        name="technicianId"
        type="text"
        required
        autocomplete="off"
        placeholder="Ingresa tu ID de técnico"
      />
    </div>

    <div class="form-group">
      <label for="password">Ingresa tu contraseña</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        autocomplete="off"
        placeholder="Contraseña"
      />
    </div>

    <button
      type="submit"
      [disabled]="!loginForm.form.valid"
      class="btn btn-primary btn-ingresar"
    >
      Ingresar
    </button>
  </form>
  <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
</div>
